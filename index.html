<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carrusel de Amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="heartsLayer"></div>
  <div id="confettiCont"></div>
  <div id="toast" class="toast"></div>

  <!-- ═══════════ FASE 1: PANTALLA DE ENTRADA ═══════════ -->
  <div id="entryScreen" class="entry-screen">

    <div id="stepCode" class="entry-step">
      <div class="entry-card">
        <div class="entry-ornament">💌</div>
        <h1 class="entry-title" id="entryTitle"></h1>
        <p class="entry-sub" id="entrySub"></p>
        <div class="code-display" id="codeDisplay">
          <span class="code-pip"></span>
          <span class="code-pip"></span>
          <span class="code-pip"></span>
          <span class="code-pip"></span>
          <span class="code-pip"></span>
          <span class="code-pip"></span>
        </div>
        <div class="numpad" id="numpad">
          <button class="nk" data-d="1">1</button>
          <button class="nk" data-d="2">2</button>
          <button class="nk" data-d="3">3</button>
          <button class="nk" data-d="4">4</button>
          <button class="nk" data-d="5">5</button>
          <button class="nk" data-d="6">6</button>
          <button class="nk" data-d="7">7</button>
          <button class="nk" data-d="8">8</button>
          <button class="nk" data-d="9">9</button>
          <button class="nk nk-del" id="delBtn">⌫</button>
          <button class="nk" data-d="0">0</button>
          <button class="nk nk-ok" id="okBtn">✓</button>
        </div>
        <p class="code-msg" id="codeMsg"></p>
      </div>
    </div>

    <div id="stepCarta" class="entry-step hidden">
      <div class="carta-wrap">
        <div class="carta-envelope" id="cartaEnvelope">
          <div class="carta-flap"></div>
          <div class="carta-body">
            <div class="carta-body-inner" id="cartaBodyInner">
              <div id="cartaClosed">
                <div class="carta-seal">💌</div>
                <h2 class="carta-title" id="cartaTitle"></h2>
                <p class="carta-sub" id="cartaSub"></p>
                <div class="carta-ring-wrap">
                  <svg class="carta-ring-svg" viewBox="0 0 120 120">
                    <circle class="ring-bg" cx="60" cy="60" r="52" />
                    <circle class="ring-fg" cx="60" cy="60" r="52" id="ringFg" />
                  </svg>
                  <div class="ring-center">
                    <span class="ring-count" id="ringCount">0</span>
                    <span class="ring-total" id="ringTotal"></span>
                  </div>
                </div>
                <p class="carta-hito" id="cartaHito"></p>
              </div>
              <div id="cartaAbierta" class="hidden">
                <p class="carta-open-msg" id="cartaOpenMsg"></p>
                <div class="carta-btns">
                  <button class="btn-si" id="btnSi"></button>
                  <button class="btn-no" id="btnNo"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══════════ FASE 2: CARRUSEL DE AMOR ═══════════ -->
  <div id="bookScreen" class="book-screen hidden">

    <!-- Reproductor de música -->
    <div class="player" id="player">
      <button class="player-toggle" id="playerToggle">🎵</button>
      <div class="player-body" id="playerBody">
        <div class="player-disc" id="playerDisc">♪</div>
        <div class="player-name" id="playerName">Cargando...</div>
        <div class="player-prog-row">
          <span class="player-t" id="playerCur">0:00</span>
          <div class="player-track" id="playerTrack">
            <div class="player-fill" id="playerFill"></div>
            <div class="player-knob" id="playerKnob"></div>
          </div>
          <span class="player-t" id="playerTot">0:00</span>
        </div>
        <div class="player-ctrl">
          <button class="pcb" id="pcPrev">⏮</button>
          <button class="pcb pcb-play" id="pcPlay">▶</button>
          <button class="pcb" id="pcNext">⏭</button>
        </div>
        <div class="player-vol-row">
          <span>🔈</span>
          <input type="range" id="playerVol" class="player-vol" min="0" max="1" step="0.01" value="0.7">
          <span>🔊</span>
        </div>
      </div>
    </div>
    <audio id="audio"></audio>

    <!-- ── CARRUSEL ── -->
    <div class="carousel-container">
      <div class="carousel-wrapper">
        <div class="carousel-track" id="carouselTrack">
          <!-- Las imágenes se generan con JavaScript -->
        </div>
      </div>

      <button class="carousel-btn prev-btn" id="carouselPrev">‹</button>
      <button class="carousel-btn next-btn" id="carouselNext">›</button>

      <div class="carousel-dots" id="carouselDots"></div>

      <div class="carousel-info">
        <p class="carousel-frase" id="carouselFrase">💗</p>
        <p class="carousel-progress" id="carouselProgress">1 / 8</p>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
